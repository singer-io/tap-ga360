version: 2.1
jobs:
  build:
    docker:
      - image: 218546966473.dkr.ecr.us-east-1.amazonaws.com/circle-ci:stitch-tap-tester-uv
    steps:
      - checkout
      - run:
          name: 'Setup virtual env'
          command: |
            uv venv --python 3.12 /usr/local/share/virtualenvs/tap-ga360
            source /usr/local/share/virtualenvs/tap-ga360/bin/activate
            uv pip install -U pip setuptools
            uv pip install .[dev]
      - run:
          name: 'pylint'
          command: |
            source /usr/local/share/virtualenvs/tap-ga360/bin/activate
            pylint tap_ga360 --disable missing-function-docstring,missing-class-docstring,missing-module-docstring,too-many-locals,invalid-name,line-too-long,consider-using-f-string,unspecified-encoding,use-yield-from
      - run:
          name: 'Unit Tests'
          command: |
            source /usr/local/share/virtualenvs/tap-ga360/bin/activate
            uv pip install pytest coverage
            mkdir -p test_output
            coverage run --source=tap_ga360 -m pytest tests/unittests --junitxml=test_output/report.xml
      - run:
          name: 'Coverage Report'
          command: |
            source /usr/local/share/virtualenvs/tap-ga360/bin/activate
            coverage report -m --fail-under=99
            coverage html
      - store_test_results:
          path: test_output
      - store_artifacts:
          path: htmlcov
      - run:
          name: 'Integration Tests'
          command: |
            source /usr/local/share/virtualenvs/tap-ga360/bin/activate
            python -m pytest tests --ignore=tests/unittests

workflows:
  version: 2
  commit:
    jobs:
      - build:
          context: circleci-user
